server:
  port: 8082

spring:
  application:
    name: accounts
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/bank/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/bank/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8080/realms/bank/protocol/openid-connect/certs
        registration:
          notifications-client:
            authorizationGrantType: client_credentials
            provider: keycloak
            client-id: accounts-service
            client-secret: ${KEYCLOAK_ACCOUNTS_CLIENT_SECRET}
            scope: internal
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        spring.json.add.type.headers: false

resilience4j:
  circuitbreaker:
    instances:
      notifications:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  retry:
    instances:
      notifications:
        max-attempts: 2
        wait-duration: 300ms
  timelimiter:
    instances:
      notifications:
        timeout-duration: 2s

logging:
  level:
    root: info
    org.springframework: info
    ru.practicum: debug
    org.springframework.boot.autoconfigure.liquibase: info
    liquibase: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans