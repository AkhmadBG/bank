{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: bank-app-secrets
type: Opaque
stringData:
  KEYCLOAK_FRONT_CLIENT_SECRET: {{ required "secrets.bankApp.KEYCLOAK_FRONT_CLIENT_SECRET is required" .Values.secrets.bankApp.KEYCLOAK_FRONT_CLIENT_SECRET | quote }}
  KEYCLOAK_ACCOUNTS_CLIENT_SECRET: {{ required "secrets.bankApp.KEYCLOAK_ACCOUNTS_CLIENT_SECRET is required" .Values.secrets.bankApp.KEYCLOAK_ACCOUNTS_CLIENT_SECRET | quote }}
  KEYCLOAK_CASH_CLIENT_SECRET: {{ required "secrets.bankApp.KEYCLOAK_CASH_CLIENT_SECRET is required" .Values.secrets.bankApp.KEYCLOAK_CASH_CLIENT_SECRET | quote }}
  KEYCLOAK_TRANSFER_CLIENT_SECRET: {{ required "secrets.bankApp.KEYCLOAK_TRANSFER_CLIENT_SECRET is required" .Values.secrets.bankApp.KEYCLOAK_TRANSFER_CLIENT_SECRET | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ required "secrets.keycloakAdmin.KC_BOOTSTRAP_ADMIN_USERNAME is required" .Values.secrets.keycloakAdmin.KC_BOOTSTRAP_ADMIN_USERNAME | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "secrets.keycloakAdmin.KC_BOOTSTRAP_ADMIN_PASSWORD is required" .Values.secrets.keycloakAdmin.KC_BOOTSTRAP_ADMIN_PASSWORD | quote }}
{{- end }}