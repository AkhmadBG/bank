apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: bank-dashboards
        orgId: 1
        folder: Bank
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
