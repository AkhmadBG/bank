apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: spring-boot
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - accounts:8082
              - cash:8083
              - transfer:8084
              - notifications:8085
              - gateway:8081
              - front:8086