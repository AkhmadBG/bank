replicaCount: 1

image:
  repository: bank/accounts
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8082

containerPort: 8082

database:
  host: postgres-account
  port: 5432
  name: account
  username: account
  password: account

keycloak:
  issuerUri: "http://localhost:8080/realms/bank"
  jwkSetUri: "http://keycloak:8080/realms/bank/protocol/openid-connect/certs"
  tokenUri: "http://keycloak:8080/realms/bank/protocol/openid-connect/token"