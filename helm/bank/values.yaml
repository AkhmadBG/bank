global:
  imagePullPolicy: IfNotPresent

front:
  enabled: true

gateway:
  enabled: true

accounts:
  enabled: true

cash:
  enabled: true

transfer:
  enabled: true

notifications:
  enabled: true

keycloak:
  enabled: true

postgres-account:
  enabled: true

postgres-cash:
  enabled: true

postgres-transfer:
  enabled: true

postgres-notification:
  enabled: true

kafka:
  enabled: true
  persistence:
    size: 1Gi
  topics:
    - name: notifications
      partitions: 1
      replicationFactor: 1

  global:
    kafka:
      bootstrapServers: kafka:9092