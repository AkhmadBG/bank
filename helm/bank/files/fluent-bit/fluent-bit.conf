[SERVICE]
    HTTP_Server   On
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*_bank_*.log
    Exclude_Path      /var/log/containers/fluent-bit-*_bank_*.log,/var/log/containers/logstash-*_bank_*.log,/var/log/containers/elasticsearch-*_bank_*.log,/var/log/containers/kibana-*_bank_*.log
    Path_Key          source_file
    Tag               bank.*
    Parser            cri
    DB                /tmp/fluent-bit.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name                modify
    Match               bank.*
    Add                 kubernetes_namespace bank

[OUTPUT]
    Name                tcp
    Match               bank.*
    Host                logstash
    Port                5000
    Format              json_lines