[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*_bank_*.log
    Tag               bank.*
    Parser            cri
    DB                /var/log/fluent-bit-state/fluent-bit.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name                modify
    Match               bank.*
    Add                 kubernetes_namespace bank

[OUTPUT]
    Name                tcp
    Match               bank.*
    Host                logstash
    Port                5000
    Format              json_lines
