server:
  port: 8086

spring:
  application:
    name: front
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/bank/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/bank/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8080/realms/bank/protocol/openid-connect/certs
        registration:
          keycloak:
            authorizationGrantType: authorization_code
            provider: keycloak
            client-id: front
            client-secret: ${KEYCLOAK_FRONT_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email

resilience4j:
  circuitbreaker:
    instances:
      gateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      gateway:
        timeout-duration: 3s

logging:
  level:
    org.springframework.security.oauth2: debug
    root: debug
    org.springframework.cloud.openfeign: DEBUG
    feign: DEBUG
    org:
      zalando:
        logbook: debug
    org.springframework: debug
    ru.yandex.practicum.market: debug
    org.springframework.boot.autoconfigure.liquibase: info
    liquibase: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans