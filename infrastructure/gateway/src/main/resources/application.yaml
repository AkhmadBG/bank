server:
  port: 8081

spring:
  application:
    name: gateway
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: gateway
      config:
        enabled: true
        defaultContext: application
        prefixes: config

    gateway:
      routes:
        - id: account_service_route
          uri: lb://accounts
          predicates:
            - Path=/account/**

        - id: cash_service_route
          uri: lb://cash
          predicates:
            - Path=/cash/**

        - id: transfer_service_route
          uri: lb://transfer
          predicates:
            - Path=/transfer/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG